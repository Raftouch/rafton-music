services:
  client:
    container_name: client
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000"
      NEXT_PUBLIC_BASE_URL: "http://localhost:3000"
    ports:
      - '3024:3000'
    depends_on:
      - server

  server:
    container_name: server
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: "postgresql://user-name:strong-password@db:5432/music-app"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: "music-app"
      POSTGRES_USER: "user-name"
      POSTGRES_PASSWORD: "strong-password"
      ACCESS_JWT_SECRET: "accessjwtsecretkey123"
      REFRESH_JWT_SECRET: "refreshjwtsecretkey123"
    ports:
      - '5000:5000'
    depends_on:
      - db
    healthcheck:
      test: ['CMD', 'wget', '--spider', 'http://localhost:5000/health']
      interval: 30s
      timeout: 10s
      retries: 5

  db:
    image: postgres
    container_name: postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: "music-app"
      POSTGRES_USER: "user-name"
      POSTGRES_PASSWORD: "strong-password"
      PGDATA: "/var/lib/postgresql/data"
    volumes:
      - db-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    ports:
      - '8888:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: "user-name@domain-name.com"
      PGADMIN_DEFAULT_PASSWORD: "strong-password"
    depends_on:
      - db
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  db-data:
  pgadmin-data:
