version: '3.8'

services:
  client:
    container_name: music-app-client-prod
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    ports:
      - '3024:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000 # Use environment variables to point to API server
    depends_on:
      - server
  server:
    container_name: music-app-server-prod
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    ports:
      - '5000:5000'
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres
    container_name: music-app-postgres-prod
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: music-app
      POSTGRES_USER: user-name
      POSTGRES_PASSWORD: strong-password
      PGDATA: /var/lib/postgresql/data/music-app
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data: