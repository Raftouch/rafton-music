version: '3.8'

services:
  client:
    container_name: music-app-client-staging
    build:
      context: ./
      dockerfile: client/Dockerfile.staging
    ports:
      - '3024:80'
    env_file:
      - ./client/.env-staging.local
    depends_on:
      - server
    networks:
      - proxy-network
    pull_policy: build

    # environment:
    #   NODE_ENV: staging

  server:
    container_name: music-app-server-staging
    build:
      context: ./
      dockerfile: server/Dockerfile.staging
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    # environment:
#       DATABASE_URL: postgres://user-name:strong-password@db/music-app
    networks:
      - proxy-network
#     depends_on:
#       - db

  nginx:
    image: nginx:alpine
    container_name: music-app-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - client
      - server
    networks:
      - proxy-network

networks:
  proxy-network:

