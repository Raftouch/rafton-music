version: "3.8"

services:
  client:
    container_name: music-app-client
    build:
      context: ./client
      dockerfile: Dockerfile.staging
    ports:
      - "3024:3000"
    environment:
      NODE_ENV: staging
    depends_on:
      - server

  server:
    container_name: music-app-server
    build:
      context: ./server
      dockerfile: Dockerfile.staging
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://user-name:strong-password@db/music-app
      NODE_ENV: staging
    depends_on:
      - db

  db:
    image: postgres
    container_name: music-app-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: music-app
      POSTGRES_USER: user-name
      POSTGRES_PASSWORD: strong-password
      PGDATA: /var/lib/postgresql/data/music-app
    volumes:
      - db-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: music-app-pgadmin
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user-name@domain-name.com
      PGADMIN_DEFAULT_PASSWORD: strong-password
    depends_on:
      - db
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  db-data:
  pgadmin-data:
