version: '3.8'

services:
  client:
    container_name: client
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - 3000:5173
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules

  db:
    image: mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      DB_PASSWORD: root
      DB_DATABASE: music-app
      DB_USER: root
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10
    ports:
      - '3306'
    volumes:
      - db-data:/var/lib/mysql

  server:
    container_name: server
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 4000:4000
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - '9001:80'
    depends_on:
      - db
    environment:
      # - PMA_ARBITRARY=1
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root

volumes:
  db-data:
