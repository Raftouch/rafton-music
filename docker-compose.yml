version: '3.8'

services:
  client:
    container_name: client
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - 3000:5173
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules

  server:
    container_name: server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - 4000:4000
    volumes:
      - ./server:/usr/src/app
  
  db:
    image: mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: music-app
      # MYSQL_USER: user
      # MYSQL_PASSWORD: password
    ports:
      - '3306'
    volumes:
      - db-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - '9001:80'
    environment:
      # - PMA_ARBITRARY=1
      - PMA_HOST=db
      # - PMA_USER=root
      # - PMA_PASSWORD=root

volumes:
  db-data:

