version: '3.8'

services:
  client:
    container_name: nest-front
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3000:3000'
    volumes:
      - ./client:/usr/src/app
    depends_on:
      - server

  server:
    container_name: nest-back
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    ports:
      - '5000:5000'
    volumes:
      - ./server:/usr/src/app
    depends_on:
      - database

  database:
    container_name: mongodb
    image: mongo:latest
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
