name: Music App CI

on:
  pull_request:
    branches: ['dev']

jobs:
  client-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
      - run: npm run lint && npm run format

  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Determine server package versions & dependencies (clean-install)
        run: npm ci
      - name: Build NestJS server
        run: npm run build --if-present
      - name: Format & lint code
        run: npm audit && npm run format && npm run lint
      - name: Start PostgreSQL
        run: pg_ctl start -l logfile
      - name: Launch integration tests
        run: npm run test:i
