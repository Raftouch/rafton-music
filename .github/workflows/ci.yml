name: Music App CI

on:
  pull_request:
    branches: ['dev']

jobs:
  server-and-client-with-tests:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://user-name:strong-password@localhost:5432/test-music-app

    services:
      db:
        image: postgres
        env:
          POSTGRES_DB: test-music-app
          POSTGRES_USER: user-name
          POSTGRES_PASSWORD: strong-password
        ports:
          - '5432:5432'
        volumes:
          - db-data:/var/lib/postgresql/data

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Backend setup
      - name: Setup Node.js for Backend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Determine server package versions & dependencies
        run: npm ci
        working-directory: server

      - name: Migrate database
        run: npm run prisma:migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        working-directory: server

      - name: Build NestJS server
        run: npm run build --if-present
        working-directory: server

      - name: Audit dependencies
        run: npm audit
        working-directory: server

      - name: Format & lint code
        run: npm run lint && npm run format
        working-directory: server

      - name: Start server
        run: npm run start:dev &
        env:
          PORT: 5000
          DATABASE_URL: ${{ env.DATABASE_URL }}
        working-directory: server
        timeout-minutes: 5

      - name: Launch integration tests
        run: npm run test
        working-directory: server

      # Frontend setup
      - name: Setup Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Determine client package versions & dependencies (clean-install)
        run: npm ci
        working-directory: client

      - name: Build NextJS client
        run: npm run build --if-present
        working-directory: client

      - name: Format & lint code
        run: npm run lint && npm run format
        working-directory: client

      - name: Start client
        run: npm run dev &
        env:
          PORT: 3000
        working-directory: client

      # E2E Tests
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 300
          browser: firefox
          working-directory: client
          command: run --headless
